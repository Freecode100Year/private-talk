# Fly.io: fly launch --copy-config --no-deploy && fly deploy && fly scale count 1
# Rooms live in one process's memory: run exactly one machine, or people
# with the same passphrase may land on different machines and never meet.
app = "private-talk"
primary_region = "nrt"

[build]

[env]
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 5000

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
