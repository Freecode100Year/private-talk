# Offline packages for networks without internet access, attached to the
# GitHub release of each version tag:
#   private-talk-<platform>.zip/.tar.gz  Node.js + app + dependencies, unzip and run
#   private-talk-app.zip                 app + dependencies, for machines with Node.js 22+
#   private-talk-docker-<arch>.tar.gz    Docker image, for `docker load`
# Names without the version keep .../releases/latest/download/<name> stable.
# Nothing is published unless the tests pass and the Windows, macOS and Linux
# packages each start and serve HTTPS on their own system.
name: offline
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    # Only here: copies of the project (Deploy to Cloudflare) don't publish.
    if: github.repository == 'Freecode100Year/private-talk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Sign the page's file list
        env: { RELEASE_SIGNING_KEY: "${{ secrets.RELEASE_SIGNING_KEY }}" }
        run: node scripts/integrity.mjs --signed
      - name: Node.js bundles
        run: scripts/offline-packages.sh "$(node -p 'require("./package.json").version')"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker images for docker load
        run: |
          v="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            docker buildx build --platform linux/$arch \
              -t ghcr.io/freecode100year/private-talk:$v -t ghcr.io/freecode100year/private-talk:${v%%.*} \
              --output type=docker,dest=out/image.tar .
            gzip -9 -c out/image.tar > out/private-talk-docker-$arch.tar.gz
            rm out/image.tar
          done
      # Signatures for the offline updater (server/update.mjs checks them
      # against server/release-key.pem of the installed version).
      - name: Sign
        env: { RELEASE_SIGNING_KEY: "${{ secrets.RELEASE_SIGNING_KEY }}" }
        run: node scripts/sign-release.mjs out/private-talk-*
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: packages, path: out/ }

  # Each package, unpacked and started on its own system, must serve HTTPS
  # with the certificate it made.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, file: private-talk-win-x64.zip }
          - { os: macos-latest, file: private-talk-darwin-arm64.tar.gz }
          - { os: macos-15-intel, file: private-talk-darwin-x64.tar.gz }
          - { os: ubuntu-latest, file: private-talk-linux-x64.tar.gz }
          - { os: ubuntu-24.04-arm, file: private-talk-linux-arm64.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: packages, path: out }
      - name: Unpack and start
        shell: bash
        run: |
          mkdir pkg
          case "${{ matrix.file }}" in
            *.zip) unzip -q "out/${{ matrix.file }}" -d pkg ;;
            *) tar -xzf "out/${{ matrix.file }}" -C pkg ;;
          esac
          dir=$(ls -d pkg/*/)
          cd "$dir"
          if [ -f node/node.exe ]; then NODE=./node/node.exe; else NODE=./node/bin/node; fi
          if [ -f start-lan.sh ]; then PORT=8443 ./start-lan.sh & else PORT=8443 $NODE app/server/lan.mjs & fi
          for i in $(seq 1 40); do curl -fsk https://127.0.0.1:8443/ >/dev/null && break; sleep 0.5; done
          cat > check.mjs <<'JS'
          import https from 'node:https'; import { readFileSync } from 'node:fs';
          const [url, expect] = process.argv.slice(2);
          https.get(url, { ca: readFileSync('lan-certs/ca.crt') }, (r) => { let b = ''; r.setEncoding('utf8'); r.on('data', (d) => { b += d; });
            r.on('end', () => { if (r.statusCode !== 200 || (expect && !b.includes(expect))) process.exit(1); console.log(url, 'OK'); }); }).on('error', (e) => { console.error(e.code); process.exit(1); });
          JS
          $NODE check.mjs https://127.0.0.1:8443/
          $NODE check.mjs https://localhost:8443/help.html 用户使用手册
          echo "OK on ${{ matrix.os }}"
      # The updater on its own system: reinstall the same signed package
      # (--force), check it, roll back, and start again.
      - name: Offline update and rollback
        shell: bash
        env: { PT_NO_PAUSE: "1" }
        run: |
          dir=$(ls -d pkg/*/)
          cd "$dir"
          if [ -f node/node.exe ]; then
            taskkill //F //IM node.exe || true
          else
            pkill -f "app/server/lan.mjs" || true
          fi
          sleep 2
          pkgfile="$GITHUB_WORKSPACE/out/${{ matrix.file }}"
          if [ -f update.cmd ]; then
            cmd //c "update.cmd $(cygpath -w "$pkgfile") --force"
            cmd //c "update.cmd --rollback"
            cmd //c "status.cmd"
          else
            ./update.sh "$pkgfile" --force
            ./update.sh --rollback
            ./status.sh
          fi
          test -d previous/app
          if [ -f node/node.exe ]; then NODE=./node/node.exe; else NODE=./node/bin/node; fi
          PORT=8443 $NODE app/server/lan.mjs &
          for i in $(seq 1 40); do curl -fsk https://127.0.0.1:8443/healthz && break; sleep 0.5; done
          curl -fsk https://127.0.0.1:8443/healthz

  release:
    needs: smoke
    # A manual run on a branch only builds and tests.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: packages, path: out }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/private-talk-*
      # What this release is made of, in one file: version, commit, protocol,
      # Node.js, the image digests (from the docker workflow) and checksums.
      - name: Release manifest
        env: { RELEASE_SIGNING_KEY: "${{ secrets.RELEASE_SIGNING_KEY }}" }
        run: |
          v="${GITHUB_REF_NAME#v}"
          img=ghcr.io/freecode100year/private-talk:$v
          for i in $(seq 1 60); do docker buildx imagetools inspect "$img" >/dev/null 2>&1 && break; sleep 20; done
          {
            echo "private-talk $v"
            echo "commit      $GITHUB_SHA"
            echo "protocol    pt2, messages v3.1 (strict by default)"
            echo "node        $(grep -o 'NODE_VERSION:-v[0-9.]*' scripts/offline-packages.sh | cut -d- -f2)"
            echo "image       $img"
            echo "digest      $(docker buildx imagetools inspect "$img" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            echo
            echo "files (sha256):"
            cat out/SHA256SUMS.txt
          } > out/RELEASE-MANIFEST.txt
          cat out/RELEASE-MANIFEST.txt
          node scripts/sign-release.mjs out/RELEASE-MANIFEST.txt
      # Assets of a published version are never replaced: a fix is a new
      # patch version.
      - name: Attach to the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "离线安装包见下方附件，用法见 docs/offline.md。"
          gh release upload "$GITHUB_REF_NAME" out/*
