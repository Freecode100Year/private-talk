name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    # Windows and macOS too: line endings, paths and the LAN certificate code
    # behave differently there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Help page is up to date
        run: node scripts/build-help.mjs --check
      - name: Server starts and serves the page
        shell: bash
        run: |
          PORT=8099 node server/server.mjs &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8099/ >/dev/null && break; sleep 0.5; done
          curl -fsI http://127.0.0.1:8099/ | grep -i 'cache-control: no-store'
          curl -fs -X POST -H 'Origin: http://127.0.0.1:8099' -D - -o /dev/null http://127.0.0.1:8099/bye | grep -i clear-site-data
          node server/smoke.mjs http://127.0.0.1:8099
      - name: Behind a secret entry path, everything else is a bare 404
        shell: bash
        run: |
          ENTRY_PATH=k7Qp2xVm9aLd PORT=8098 node server/server.mjs &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8098/k7Qp2xVm9aLd/ >/dev/null && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8098/)" = 404
          ! curl -sI http://127.0.0.1:8098/ | grep -iE 'content-security|strict-transport|referrer'
          node server/smoke.mjs http://127.0.0.1:8098/k7Qp2xVm9aLd
      - name: LAN mode makes its certificate and serves HTTPS
        shell: bash
        run: |
          LAN_CERTS="$RUNNER_TEMP/lan" PORT=8443 node server/lan.mjs &
          for i in $(seq 1 30); do curl -fsk https://127.0.0.1:8443/ >/dev/null && break; sleep 0.5; done
          node scripts/check-https.mjs "$RUNNER_TEMP/lan/ca.crt" https://127.0.0.1:8443/
          node scripts/check-https.mjs "$RUNNER_TEMP/lan/ca.crt" https://localhost:8443/help.html 用户使用手册
          node server/smoke.mjs https://127.0.0.1:8443 --insecure
      - name: Windows itself trusts the LAN certificate once the CA is installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Certificate -FilePath "$env:RUNNER_TEMP\lan\ca.crt" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $r = Invoke-WebRequest https://localhost:8443/ -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "status $($r.StatusCode)" }
          "Schannel accepted the name-constrained LAN certificate"

  # The Cloudflare version in its own runtime (workerd, via wrangler dev; no
  # account needed): two clients chat through the Worker and Durable Object.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Chat through the Worker
        env: { WRANGLER_SEND_METRICS: "false", CI: "true" }
        run: |
          npx wrangler dev --port 8799 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8799/ >/dev/null && break; sleep 1; done
          node server/smoke.mjs http://127.0.0.1:8799 || { cat wrangler.log; exit 1; }

  # The Docker deployment as users run it: compose + Caddy (with its own
  # local CA for a .internal name), ./pt setup, status, and an upgrade that
  # fails its check and must roll back by itself.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image under the pinned version
        run: |
          v=$(node -p 'require("./package.json").version')
          docker build -q -t ghcr.io/freecode100year/private-talk:$v .
          docker tag ghcr.io/freecode100year/private-talk:$v ghcr.io/freecode100year/private-talk:$v-broken
      - name: Set up, check, failed upgrade rolls back
        run: |
          cat > docker-compose.override.yml <<'YML'
          services:
            caddy:
              ports: !override
                - "127.0.0.1:18443:443"
              networks:
                default:
                  aliases: [chat.internal]
          YML
          printf 'PT_URL=https://chat.internal\nPT_INSECURE=1\n' > .env
          ./pt setup chat.internal
          ./pt status | tee status.txt
          grep -q '^OK' status.txt
          v=$(node -p 'require("./package.json").version')
          if ./pt upgrade "$v-broken"; then echo "a broken upgrade was accepted"; exit 1; fi
          grep -q "^PT_VERSION=$v$" .env
          ./pt status | grep -q '^OK'
          ./pt logs > logs.txt
          ! grep -E '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]+' logs.txt | grep -v '0.0.0.0'
