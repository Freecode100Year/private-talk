name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    # Windows and macOS too: line endings, paths and the LAN certificate code
    # behave differently there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Help page is up to date
        run: node scripts/build-help.mjs --check
      - name: Server starts and serves the page
        shell: bash
        run: |
          PORT=8099 node server/server.mjs &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8099/ >/dev/null && break; sleep 0.5; done
          curl -fsI http://127.0.0.1:8099/ | grep -i 'cache-control: no-store'
          curl -fs -X POST -H 'Origin: http://127.0.0.1:8099' -D - -o /dev/null http://127.0.0.1:8099/bye | grep -i clear-site-data
      - name: LAN mode makes its certificate and serves HTTPS
        shell: bash
        run: |
          LAN_CERTS="$RUNNER_TEMP/lan" PORT=8443 node server/lan.mjs &
          for i in $(seq 1 30); do curl -fsk https://127.0.0.1:8443/ >/dev/null && break; sleep 0.5; done
          node scripts/check-https.mjs "$RUNNER_TEMP/lan/ca.crt" https://127.0.0.1:8443/
          node scripts/check-https.mjs "$RUNNER_TEMP/lan/ca.crt" https://localhost:8443/help.html 用户使用手册
      - name: Windows itself trusts the LAN certificate once the CA is installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Certificate -FilePath "$env:RUNNER_TEMP\lan\ca.crt" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $r = Invoke-WebRequest https://localhost:8443/ -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "status $($r.StatusCode)" }
          "Schannel accepted the name-constrained LAN certificate"
