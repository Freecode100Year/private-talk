# Builds the Docker image for amd64 and arm64 and publishes it to
# ghcr.io/freecode100year/private-talk.
#   push to main      -> :edge
#   tag v1.2.3        -> :1.2.3  :1.2  :1  :latest
name: docker
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    uses: ./.github/workflows/test.yml

  image:
    needs: test
    # Only here: copies of the project (Deploy to Cloudflare) don't publish.
    if: github.repository == 'Freecode100Year/private-talk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/private-talk
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=隐匿对话 private-talk
            org.opencontainers.image.description=匿名、临时、端对端加密的私密聊天室
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build provenance and a software bill of materials, attached to the image.
          provenance: mode=max
          sbom: true
