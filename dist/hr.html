<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>HTML Room · 创建或进入房间</title><link rel="stylesheet" href="hr.css"><script defer src="hr.js"></script></head><body><form id="maker"><h1>创建 HTML 房间</h1><p>同一份文件进入同一聊天房间，生成过程在本浏览器内完成。</p><label for="mk-relay">中继源（必须支持本分支 /hr/ 路由）</label><input id="mk-relay" required maxlength="200"><label for="mk-pass">可选打开口令（建议随机生成，通过独立渠道传递）</label><input id="mk-pass" type="password" maxlength="1024" autocomplete="off"><button id="mk-gen" type="button">随机生成高熵口令</button><button id="mk-make">创建房间</button><p id="mk-error" role="status"></p><section id="mk-out" hidden><a id="mk-download" download="private-talk-room.html">下载房间文件</a><section id="mk-link-row" hidden><p>网页入口代码可读取 Fragment；其安全性不等同于经过验证的离线文件。手机预览兼容性仍未验证。</p><input id="mk-link" readonly aria-label="房间链接"><button id="mk-copy" type="button">复制网页链接</button></section></section></form><section id="room-panel" hidden><h1>私密聊天房间</h1><aside id="risk">此文件包含完整房间密钥，请勿通过未加密的社交软件直接发送。口令模式也可被离线猜测；建议高熵密码，通过独立渠道传递口令。</aside><p id="status" role="status">聊天脚本尚未启动，请查看下方浏览器打开说明。</p><section id="preview-help"><p>若此提示一直显示，当前文件预览未能运行聊天脚本。iOS「文件」、微信或 QQ 的预览可能无法使用此房间；输入口令不会生效。请在 Safari 等浏览器中打开房间网页链接。</p></section><form id="unlock"><label for="password">房间口令（无口令文件可直接进入）</label><input id="password" disabled type="password" maxlength="1024" autocomplete="off"><button id="enter" disabled>解锁并进入</button></form><p id="presence"></p><p id="safety"></p><ol id="messages" aria-live="polite"></ol><form id="chat" hidden><label for="text">消息（最多 500 字）</label><textarea id="text" maxlength="500"></textarea><button id="send">发送</button></form></section></body></html>
