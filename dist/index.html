<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="匿名、临时、端对端加密的私密对话，不保存历史" />
    <meta name="referrer" content="no-referrer" />
    <title>隐匿对话</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="回到开始"><span class="brand-mark">⌁</span>隐匿对话</a>
        <span class="demo-badge">临时 · 匿名 · 端对端加密</span>
      </header>

      <section class="stage" id="createStage">
        <div class="eyebrow">临时 · 匿名 · 无历史</div>
        <h1>和陌生人，<br /><em>只聊这一会儿。</em></h1>
        <p class="lede">输入一个暗号进入私密房间。无需账号，不保存消息；最后一人离开，房间就不存在了。</p>
        <form class="create-card" id="createForm">
          <label for="roomName">房间暗号 <span>英文字母和数字，至少 8 位</span></label>
          <input id="roomName" maxlength="64" placeholder="例如：FridayCoffee2026" autocomplete="off" autocapitalize="off" spellcheck="false" required />
          <button class="primary-button" id="createButton">进入房间 <span>→</span></button>
          <p class="fine-print">暗号就是钥匙：知道暗号的人都能进来，消息也用它在浏览器里加密，服务器只转发看不懂的密文。暗号越长越难猜；只通过可信渠道分享。</p>
        </form>
        <div class="principles">
          <div><span>01</span>不需要身份</div>
          <div><span>02</span>不保存历史</div>
          <div><span>03</span>端对端加密</div>
        </div>
      </section>

      <section class="chat-stage hidden" id="chatStage" aria-live="polite">
        <aside class="chat-side">
          <div class="eyebrow">当前房间</div>
          <h2 id="chatRoomName"></h2>
          <div id="memberList"></div>
          <div class="expire-card"><span>在线</span><strong id="memberCount">0 / 8</strong><small>最多 8 人；最后一人离开，会话结束。</small></div>
          <button class="secondary-button wide" id="copyButton" type="button">复制房间链接</button>
          <button class="leave-button" id="leaveButton" type="button">离开房间</button>
        </aside>
        <div class="conversation">
          <div class="conversation-head"><span><b class="secure-dot" id="statusDot"></b><span id="statusText">正在连接…</span></span><span>端对端加密 · 不保存历史</span></div>
          <div class="messages" id="messages"></div>
          <form class="composer" id="messageForm">
            <input id="messageInput" maxlength="500" placeholder="写一条消息…" autocomplete="off" disabled />
            <span class="char-count" id="charCount">0 / 500</span>
            <button class="send-button" aria-label="发送消息" disabled id="sendButton">↑</button>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
