# 隐匿对话 through a Cloudflare Tunnel: no open ports, no public IP, HTTPS
# handled by Cloudflare. Good for a home computer, a NAS or a Raspberry Pi.
#   1. Cloudflare dashboard → Zero Trust → Networks → Tunnels → Create a
#      tunnel (cloudflared). Copy its token.
#   2. In the tunnel's Public Hostname tab, add your hostname with service
#      HTTP → app:8080
#   3. In .env: COMPOSE_FILE=docker-compose.tunnel.yml and TUNNEL_TOKEN=<token>
#      (and DOMAIN=<your hostname> for ./pt status), then: docker compose up -d
#      The token is a secret: .env is not shared or committed.
services:
  app:
    image: ghcr.io/freecode100year/private-talk:${PT_VERSION:-2.16.1}
    restart: unless-stopped
    environment:
      ENTRY_PATH: ${ENTRY_PATH:-}
      TRUST_PROXY: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: { max-size: 1m, max-file: "2" }

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    command: tunnel --no-autoupdate --loglevel warn run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN to the tunnel token from the Cloudflare dashboard}
    logging:
      driver: local
      options: { max-size: 1m, max-file: "2" }
