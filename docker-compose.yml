# 隐匿对话 with automatic HTTPS (Caddy).
#   1. Point your domain's DNS (A/AAAA) at this server; open ports 80 and 443.
#   2. ./pt setup chat.example.com      (saves DOMAIN and the version in .env)
#   Then: ./pt status · ./pt upgrade · ./pt rollback · ./pt logs
# Settings live in .env (see .env.example), so every later command finds them.
# Versions are pinned: PT_VERSION in .env (default below) and Caddy's here.
# To build the app from this checkout instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Logs: only start-up, certificate and error messages, kept small; Caddy's
# access log is off and its own messages are limited to warnings (Caddyfile),
# so no visitor addresses, rooms or passphrases are recorded.
services:
  app:
    image: ghcr.io/freecode100year/private-talk:${PT_VERSION:-2.15.1}
    restart: unless-stopped
    environment:
      ENTRY_PATH: ${ENTRY_PATH:-}
      TRUST_PROXY: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: { max-size: 1m, max-file: "2" }

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. DOMAIN=chat.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: local
      options: { max-size: 1m, max-file: "2" }

volumes:
  caddy_data:
  caddy_config:
